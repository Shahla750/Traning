<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #triangle{
            width: 0;
            height: 0;
            border-left: 150px solid transparent;
            border-right: 150px solid transparent;
            border-bottom: 260px solid #3498db;
            position: relative;
        }
        #circle{
            width: 80px;
            height: 80px;
            background-color: rgb(234, 103, 103);
            border-radius: 50%;
            position: absolute;
            top: 120px;
            left: -40px;
        }
        #circle:hover{
            background-color: #e9cf8e;
        }
    </style>
</head>
<body>
    <div id="triangle" >Triangle
    <div id="circle">Cicle</div>
    </div>
</body>
</html>
