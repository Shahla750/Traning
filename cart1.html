<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <script type="text/javascript" src="edit.js"></script>
</head>
<body>
    <h3 class="text-center mt-3">Shopping Cart</h3>

    <div class="container">

        <div class="form-group mb-2">
            <label for="name">Product</label>
            <input type="text" class="form-control" id="name"/>
        </div>

        <div class="form-group mb-2">
            <label for="qty">Quantity</label>
            <input type="number" class="form-control" id="qty" oninput="findAmount();"/>
        </div>

        <div class="form-group mb-2">
            <label for="price">Price</label>
            <input type="number" class="form-control" id="price" oninput="findAmount();"/>
        </div>

        <div class="form-group mb-2">
            <label for="amount">Amount</label>
            <input type="number" class="form-control" id="amount" readonly/>
        </div>

        <button type="button" id="addBtn" class="btn btn-primary mt-2" onclick="addItem()">Add</button>
        <button type="button" id="updateBtn" class="btn btn-success mt-2" onclick="updateQty()" style="display:none;">Update Quantity</button>

    </div>

    <h3 class="text-center mt-4">Cart Details</h3>
    <div class="container" id="scart"></div>

</body>
</html>
