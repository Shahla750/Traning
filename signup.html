<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
    
    
</head>
<body>
<h1>Registration Form</h1>
<form>

    <label for="name">Username:</label>
    <input type="text" id="name" name="username" placeholder="Enter Name" required>
    <br><br>

    <label for="pwd">Password:</label>
    <input type="password" id="pwd" name="password" placeholder="Enter Password" required>
    <br><br>

    <label for="cpwd">Confirm Password:</label>
    <input type="password" id="cpwd" name="confirm_password" placeholder="Enter Confirm Password" required>
    <br><br>

    <label for="date">Date of Birth:</label>
    <input type="date" id="date" name="dob" placeholder="Enter Date Of Birth">
    <br><br>

    <label>Gender:</label>
    <input type="radio" id="m" name="gender" value="Male" >
    <label for="m">Male</label>

    <input type="radio" id="f" name="gender" value="Female">
    <label for="f">Female</label>
    <br><br>

    <label>Hobbies:</label><br>
    <input type="checkbox" name="hobbies" value="Baking"> Baking<br>
    <input type="checkbox" name="hobbies" value="Riding"> Riding<br>
    <input type="checkbox" name="hobbies" value="Cooking"> Cooking<br>
    <input type="checkbox" name="hobbies" value="Singing"> Singing<br>
    <input type="checkbox" name="hobbies" value="Dancing"> Dancing<br>
    <input type="checkbox" name="hobbies" value="Movies"> Watching Movies
    <br><br>

    <button type="submit">Submit</button>

</form>

</body>
</html>
