<!DOCTYPE html>
<html>
<head>
    <title>Sort Numbers</title>
    <link rel="stylesheet" href="sort.css">
</head>

<body>

<div class="box">
    <h3>Sort Numbers using Bubble Sort</h3>

    <input type="text" id="numbers"
           placeholder="Enter positive numbers separated by space">

    <button onclick="sortNumbers()">Sort Numbers</button>

    <div class="result">
        <p><b>Sorted Numbers:</b></p>
        <span id="sortedOutput"></span>

        <p><b>Frequency of Numbers:</b></p>
        <div id="frequencyOutput"></div>
    </div>
</div>

<script src="sort.js"></script>
</body>
</html>
