<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
         #triangle{
            width: 0;
            height: 0;
            border-left: 100px solid transparent;
            border-right: 100px solid transparent;
            border-bottom: 160px solid #3498db;
            position:absolute;
           top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
        } 
        #circle{
            width: 500px;
            height: 500px;
            background-color: rgb(191, 34, 34);
            border-radius: 50%;
            position: relative;
            
        }
        #triangle:hover{
    border-bottom-color: antiquewhite;
}

    </style>
</head>
<body>
    <div id="circle">
    <div id="triangle"></div>
    </div>
   
    
</body>
</html>
