<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
      crossorigin="anonymous"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
      crossorigin="anonymous"
    ></script>
    <title>Document</title>
  </head>
  <body>
    <div class="container my-3 mx-3">
        <div class="form-check">
            <input type="checkbox" class="form-check-input" id="idCheckTnC" onclick="enableButton()">
            <label for="ïdCheckTnC"> I have read and accepted the T n C</label>
        </div>
        <div>
            <button class="btn btn-success" id='idSubmitBtn' disabled>
                Submit
            </button>
        </div>
    </div>
    <script>
        function enableButton() {
            checkBox = document.getElementById('idCheckTnC')
            button = document.getElementById('idSubmitBtn')
            button.disabled = !checkBox.checked
        }
    </script>
  </body> 
</html>
